# ================================================================
# 平台接口清单 (多服务合并) - ibosssoft AI 平台
# 架构: Dify(ai-func) + RagFlow(rag-func) + CAS(cas-func)
# 认证: Dify=Bearer token; RagFlow='Authorization' Header; CAS=会话
# 生成: 2026-09-15 09:28:47
# 说明: Dify 清单含实测过滤(移除404)；RagFlow/CAS 基于开源代码+实测组合
# ================================================================

platform:
  name: ibosssoft AI 功能平台
  services:
    - name: ai-func (Dify 魔改)
      base_url: http://ai-func.ibosssoft.com.cn
      auth: "Authorization: Bearer <token>"
      note: 未认证 401 {'code':'unauthorized'}
    - name: rag-func (RagFlow 魔改)
      base_url: http://rag-func.ibosssoft.com.cn
      auth: "Authorization: Bearer <api_key>"
      note: "未认证 code:0; 无效key code:109"
    - name: cas-func (CAS SSO)
      base_url: http://cas-func.ibosssoft.com.cn
      auth: TGT/TGC Cookie 会话

